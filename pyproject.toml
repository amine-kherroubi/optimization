[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bin-packing"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
# Discover all packages rooted at the repo root but only include bin_packing.*
where = ["."]
include = ["bin_packing*"]
